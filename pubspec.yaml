name: jmoe
description: "JMoe - JMComic 客户端（Flutter 重写），支持 JM 与 E-Hentai 双源"
repository: https://github.com/liuyuexiaoyu1/jmoe
homepage: https://github.com/liuyuexiaoyu1
license: MIT
publish_to: 'none'
version: 1.6.0+5

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  crypto: ^3.0.6
  html: ^0.15.5
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  video_player: ^2.10.0
  photo_view: ^0.15.0
  url_launcher: ^6.3.2
  image: ^4.8.0
  # 本地下载用无加密 zip 打包（分享时才用 .jmoe 加密格式）
  archive: ^4.0.7
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    # 应用图标（登录页 / 关于页展示用，与桌面图标同源）
    - assets/icon/

# 锁定插件版本：path_provider_android 2.3.0+ 与 shared_preferences_android 2.5.0+
# 通过 jni/jni_flutter 引入原生 C 代码，构建时需要 CMake 与 NDK。
# 本工程无原生代码，故钉在不含 jni 的最后版本，保持纯 Dart/Java 构建。
dependency_overrides:
  path_provider_android: 2.2.23
  shared_preferences_android: 2.4.28
