name: jmoe
description: "JMoe - JMComic 客户端（Flutter 重写），支持 JM 与 E-Hentai 双源"
repository: https://github.com/liuyuexiaoyu1/jmoe
homepage: https://github.com/liuyuexiaoyu1
license: MIT
publish_to: 'none'
version: 1.6.0+5

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  crypto: ^3.0.6
  html: ^0.15.5
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  video_player: ^2.10.0
  photo_view: ^0.15.0
  url_launcher: ^6.3.2
  image: ^4.8.0
  # 本地下载用无加密 zip 打包（分享时才用 .jmoe 加密格式）
  archive: ^4.0.7
  pointycastle: ^4.0.0

  # ---- HarmonyOS 平台实现 ----
  # 官方插件均无 ohos 平台代码，缺失会导致启动时
  # SharedPreferences.getInstance() 抛 MissingPluginException，
  # main() 未捕获 -> runApp 永不执行 -> 白屏。
  shared_preferences_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/shared_preferences/shared_preferences_ohos
      ref: master
  path_provider_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider_ohos
      ref: master
  url_launcher_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/url_launcher/url_launcher_ohos
      ref: master
  video_player_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/video_player/video_player_ohos
      ref: master


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    # 应用图标（登录页 / 关于页展示用，与桌面图标同源）
    - assets/icon/

# 锁定插件版本：path_provider_android 2.3.0+ 与 shared_preferences_android 2.5.0+
# 通过 jni/jni_flutter 引入原生 C 代码，构建时需要 CMake 与 NDK。
# 本工程无原生代码，故钉在不含 jni 的最后版本，保持纯 Dart/Java 构建。
dependency_overrides:
  path_provider_android: 2.2.23
  shared_preferences_android: 2.4.28
  # flutter_cache_manager 3.5.0 要求 sqflite ^2.4.2，
  # 不能用 issue 里提到的 2.2.8（会解析失败）。
  # br_v2.4.2_ohos 分支同时满足版本约束并带 ohos 平台实现。
  sqflite:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_sqflite.git
      path: sqflite
      ref: br_v2.4.2_ohos
